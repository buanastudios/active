<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buana Studios | Admin CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Admin specific styles */
    body { background: #0a0a0a; display: flex; flex-direction: column; min-height: 100vh; }
    .admin-container { max-width: 800px; margin: 4rem auto; padding: 0 1.5rem; width: 100%; }
    
    #login-screen { text-align: center; margin-top: 10vh; }
    #login-screen input { width: 100%; max-width: 400px; padding: 1rem; margin-bottom: 1rem; background: #111; border: 1px solid var(--border); color: #fff; border-radius: var(--radius); }
    
    #dashboard { display: none; }
    .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 3rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--border); }
    
    .editor-section { background: #111; border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; margin-bottom: 2rem; }
    .editor-section h3 { margin-bottom: 1.5rem; color: var(--accent); }
    
    .form-group { margin-bottom: 1.5rem; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 0.5rem; letter-spacing: 0.1em; }
    .form-group input, .form-group textarea { width: 100%; padding: 0.75rem; background: #080808; border: 1px solid var(--border-strong); color: #fff; border-radius: 4px; font-family: inherit; }
    .form-group textarea { resize: vertical; min-height: 100px; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); outline: none; }
    
    .product-list { display: flex; flex-direction: column; gap: 1rem; }
    .product-row { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #080808; border: 1px solid var(--border); border-radius: 4px; cursor: pointer; transition: border-color 0.2s; }
    .product-row:hover { border-color: var(--accent); }
    
    #product-editor { display: none; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border); }
    
    .save-bar { position: sticky; bottom: 0; background: rgba(10,10,10,0.9); backdrop-filter: blur(10px); padding: 1.5rem 0; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    
    .status-msg { font-size: 0.85rem; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="admin-container">
    
    <!-- Login Screen -->
    <div id="login-screen" class="reveal visible">
      <h2 style="margin-bottom: 1rem;">Admin Auth</h2>
      <p class="text-muted" style="margin-bottom: 2rem; font-size: 0.9rem;">Enter your GitHub Personal Access Token to edit site content.</p>
      <input type="password" id="gh-token" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      <br>
      <button class="btn btn-primary" id="btn-login">Connect</button>
      <p id="login-error" style="color: #e05555; margin-top: 1rem; font-size: 0.85rem; display: none;">Invalid token or repository access denied.</p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard">
      <div class="admin-header">
        <h2>Content Manager</h2>
        <button class="btn btn-ghost" id="btn-logout" style="padding: 0.5rem 1rem; font-size: 0.65rem;">Logout</button>
      </div>
      
      <!-- Global Settings -->
      <div class="editor-section">
        <h3>Global Settings</h3>
        <div id="global-editor"></div>
      </div>
      
      <!-- Products List -->
      <div class="editor-section">
        <h3>Products</h3>
        <div class="product-list" id="products-list"></div>
        
        <!-- Individual Product Editor -->
        <div id="product-editor">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h4 id="editing-product-title" style="color:#fff;">Editing...</h4>
            <button class="btn btn-ghost" id="btn-close-product" style="padding: 0.3rem 0.8rem; font-size: 0.6rem;">Close</button>
          </div>
          <div id="product-form-fields"></div>
        </div>
      </div>

      <!-- Journal List -->
      <div class="editor-section">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
          <h3 style="margin:0;">Journal Notes</h3>
          <button class="btn btn-ghost" id="btn-add-journal" style="padding: 0.3rem 0.8rem; font-size: 0.6rem;">+ Add Note</button>
        </div>
        <div class="product-list" id="journal-list"></div>
        
        <!-- Individual Journal Editor -->
        <div id="journal-editor" style="display:none; margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
            <h4 id="editing-journal-title" style="color:#fff;">Editing Note...</h4>
            <div style="display:flex; gap:0.5rem;">
              <button class="btn btn-ghost" id="btn-delete-journal" style="padding: 0.3rem 0.8rem; font-size: 0.6rem; color:#e05555; border-color:#e05555;">Delete</button>
              <button class="btn btn-ghost" id="btn-close-journal" style="padding: 0.3rem 0.8rem; font-size: 0.6rem;">Close</button>
            </div>
          </div>
          <div id="journal-form-fields"></div>
        </div>
      </div>
    </div>
    
  </div>

  <!-- Save Bar -->
  <div class="save-bar" id="save-bar" style="display:none;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center; width:100%; max-width:800px; padding:0 1.5rem;">
      <div class="status-msg" id="save-status">Unsaved changes</div>
      <div style="display:flex; gap:1rem;">
        <button class="btn btn-ghost" id="btn-preview" style="border-color:var(--accent); color:var(--accent);">Preview Locally</button>
        <button class="btn btn-primary" id="btn-save">Commit to GitHub</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
</body>
</html>
